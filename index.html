<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scopa Siciliana</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b6623;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 10px;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .score-board { font-size: 14px; color: #f4d35e; font-weight: bold; }
        .voice-btn {
            background: #27ae60; color: white; border: none; padding: 6px 12px;
            border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .section-title { font-size: 13px; margin: 8px 0 4px 0; color: #f4d35e; font-weight: bold; }
        .table, .hand {
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
            min-height: 130px; margin-bottom: 10px; position: relative;
        }
        .card {
            background: #fffdf5; width: 78px; height: 125px; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 2px solid #222; cursor: pointer; user-select: none;
        }
        .card-corner { font-size: 11px; font-weight: bold; color: #111; width: 100%; text-align: left; }
        .card-corner.br { text-align: right; }
        .card-illustration { width: 100%; height: 85px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #111; }
        .card-back { background: #900C3F; border: 2px solid #ffffff; justify-content: center; align-items: center; }
        .card-back-design {
            width: 86%; height: 86%; border: 2px solid #f4d35e;
            background: repeating-linear-gradient(45deg, #581845, #581845 6px, #900C3F 6px, #900C3F 12px);
            border-radius: 3px;
        }
        .scopa-banner {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: linear-gradient(135deg, #f1c40f, #e67e22);
            color: #fff; padding: 20px 40px; border-radius: 15px; border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.9); font-size: 32px; font-weight: bold;
            z-index: 100; animation: scopaPop 0.8s ease-in-out;
        }
        @keyframes scopaPop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-board">Scope Tuoi: <span id="userScore">0</span> | CPU: <span id="cpuScore">0</span></div>
        <button class="voice-btn" onclick="toggleVoice()">🎤 Chat Vocale</button>
    </div>

    <h1>Scopa Siciliana</h1>

    <div id="scopaBanner" class="scopa-banner">🌟 SCOPA! 🌟</div>

    <div class="section-title">Avversario (CPU)</div>
    <div class="table" id="cpuHand"></div>

    <div class="section-title">Tavolo</div>
    <div class="table" id="tableCards"></div>

    <div class="section-title">Tua Mano</div>
    <div class="hand" id="userHand"></div>

    <script>
        const suits = ['Oro', 'Coppe', 'Spade', 'Bastoni'];
        const suitIcons = { 'Oro': '🪙', 'Coppe': '🏆', 'Spade': '⚔️', 'Bastoni': '🪵' };
        
        let deck = [];
        let table = [];
        let userHand = [];
        let cpuHand = [];
        let userScore = 0;
        let cpuScore = 0;

        function createDeck() {
            deck = [];
            for (let suit of suits) {
                for (let val = 1; val <= 10; val++) {
                    deck.push({ value: val, suit: suit });
                }
            }
            deck.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            createDeck();
            userHand = [deck.pop(), deck.pop(), deck.pop()];
            cpuHand = [deck.pop(), deck.pop(), deck.pop()];
            table = [deck.pop(), deck.pop(), deck.pop(), deck.pop()];
            render();
        }

        function renderCard(card, onClick = null, isBack = false) {
            if (isBack) {
                return `<div class="card card-back"><div class="card-back-design"></div></div>`;
            }
            const color = (card.suit === 'Oro' || card.suit === 'Coppe') ? '#c0392b' : '#2980b9';
            return `
                <div class="card" ${onClick ? `onclick="${onClick}"` : ''}>
                    <div class="card-corner" style="color: ${color}">${card.value}</div>
                    <div class="card-illustration">${suitIcons[card.suit]}</div>
                    <div class="card-corner br" style="color: ${color}">${card.value}</div>
                </div>
            `;
        }

        function render() {
            document.getElementById('tableCards').innerHTML = table.map(c => renderCard(c)).join('');
            document.getElementById('userHand').innerHTML = userHand.map((c, i) => renderCard(c, `playUserCard(${i})`)).join('');
            document.getElementById('cpuHand').innerHTML = cpuHand.map(() => renderCard(null, null, true)).join('');
            document.getElementById('userScore').innerText = userScore;
            document.getElementById('cpuScore').innerText = cpuScore;
        }

        function playUserCard(index) {
            const playedCard = userHand.splice(index, 1)[0];
            processTake(playedCard, 'user');
            render();
            
            if (userHand.length === 0 && cpuHand.length === 0 && deck.length > 0) {
                userHand = [deck.pop(), deck.pop(), deck.pop()];
                cpuHand = [deck.pop(), deck.pop(), deck.pop()];
                render();
            }

            if (cpuHand.length > 0) {
                setTimeout(playCpuCard, 1000);
            }
        }

        function playCpuCard() {
            const playedCard = cpuHand.splice(0, 1)[0];
            processTake(playedCard, 'cpu');
            render();
        }

        function processTake(card, player) {
            // 1. Cerca presa singola
            let singleIndex = table.findIndex(c => c.value === card.value);
            if (singleIndex !== -1) {
                table.splice(singleIndex, 1);
                checkScopa(player);
                return;
            }

            // 2. Cerca combinazione di due carte che sommano al valore giocato
            for (let i = 0; i < table.length; i++) {
                for (let j = i + 1; j < table.length; j++) {
                    if (table[i].value + table[j].value === card.value) {
                        table.splice(j, 1);
                        table.splice(i, 1);
                        checkScopa(player);
                        return;
                    }
                }
            }

            // 3. Nessuna presa: la carta resta sul tavolo
            table.push(card);
        }

        function checkScopa(player) {
            if (table.length === 0) {
                if (player === 'user') {
                    userScore++;
                    showBanner("🌟 SCOPA TUA! 🌟");
                } else {
                    cpuScore++;
                    showBanner("🤖 SCOPA CPU! 🤖");
                }
            }
        }

        function showBanner(msg) {
            const banner = document.getElementById('scopaBanner');
            banner.innerText = msg;
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 1800);
        }

        function toggleVoice() {
            alert("🎤 Usa la Chat Vocale di gruppo in alto su Telegram per parlare mentre giochi!");
        }

        initGame();
    </script>
</body>
</html>
