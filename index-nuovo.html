
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scopa Monopolygoita</title>
<style>
*{box-sizing:border-box}
:root{--gold:#f5d58b;--green:#06452f;--felt:#0b6040;--cream:#fff4d9}
body{margin:0;background:radial-gradient(ellipse at center,#16734b,#052c20);color:var(--cream);font-family:Arial,sans-serif;text-align:center;min-height:100vh}
header{padding:15px 8px;background:linear-gradient(110deg,#173c2b,#806020,#173c2b);border-bottom:2px solid var(--gold)}
h1{font-size:23px;margin:0;color:#ffe3a0;text-shadow:0 2px 5px #000}
.subtitle{font-size:12px;margin-top:5px;letter-spacing:2px}
.scorebar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px}
.score{background:#102f24;border:1px solid var(--gold);border-radius:12px;padding:9px 15px;font-weight:bold}
main{max-width:850px;margin:auto;padding:8px}
.area{margin:12px 0;padding:12px 8px;border:1px solid #b99b54;border-radius:18px;background:rgba(0,20,13,.35);box-shadow:0 4px 14px #001b12}
.area h2{font-size:14px;color:var(--gold);margin:0 0 10px;letter-spacing:1px}
.cards{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;min-height:100px}
.card{width:66px;height:100px;border-radius:9px;background:linear-gradient(145deg,#fffdf1,#e8d6ad);color:#29241b;border:2px solid #f4e4bc;box-shadow:0 4px 7px #00180e;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;user-select:none;transition:.15s}
.card .rank{font-size:25px;font-weight:900}
.card .suit{font-size:29px;line-height:1.1}
.card .name{font-size:9px;font-weight:bold;margin-top:4px}
.card.red{color:#b52827}
.card.back{background:repeating-linear-gradient(45deg,#174b37,#174b37 5px,#d8b96e 5px,#d8b96e 7px);border:3px solid #f5e5bd;color:transparent}
.card.selected{transform:translateY(-7px);outline:3px solid #ffe17c}
.card.take-option{outline:3px solid #65ff9a;box-shadow:0 0 16px #65ff9a;transform:translateY(-4px)}
.card.take-chosen{outline:4px solid #ffe17c;box-shadow:0 0 20px #ffe17c;transform:translateY(-8px)}
.card:active{transform:scale(.97)}
button{border:1px solid #ffe6a1;border-radius:12px;padding:12px 17px;margin:5px;background:linear-gradient(#f6dc91,#b58b38);color:#241b09;font-weight:bold;font-size:15px;cursor:pointer;box-shadow:0 3px 8px #001b11}
button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:linear-gradient(#f5f0dc,#c8c0a7)}
#message{margin:12px auto;padding:12px;min-height:43px;border-radius:12px;background:#092d20;border:1px solid #a88b4a;line-height:1.4}
.legend{font-size:12px;color:#f8e8bd;margin:8px}
#scopaBanner{display:none;color:#ffe18a;font-size:25px;font-weight:900;padding:10px;text-shadow:0 0 12px #ffb000;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@media(max-width:420px){.card{width:57px;height:88px}.card .rank{font-size:22px}.card .suit{font-size:25px}h1{font-size:20px}.area{padding:10px 4px}}
</style>
</head>
<body>
<header>
<h1>♠ SCOPA MONOPOLYGOITA ♠</h1>
<div class="subtitle">TRADIZIONE • STRATEGIA • DIVERTIMENTO</div>
</header>
<div class="scorebar">
<div class="score">Tu: <span id="playerScore">0</span></div>
<div class="score">Computer: <span id="cpuScore">0</span></div>
<div class="score">Mazzo: <span id="deckCount">40</span></div>
</div>
<main>
<section class="area">
<h2>AVVERSARIO</h2>
<div id="cpuHand" class="cards"></div>
</section>
<section class="area">
<h2>TAVOLO DA GIOCO</h2>
<div id="table" class="cards"></div>
<div class="legend">🟢 Carte verdi: possibili prese · 🟡 Oro: carte selezionate</div>
</section>
<div id="scopaBanner">✨ SCOPA! ✨</div>
<div id="message">Premi una tua carta per iniziare.</div>
<section class="area">
<h2>LE TUE CARTE</h2>
<div id="playerHand" class="cards"></div>
</section>
<button id="play" disabled>Gioca carta</button>
<button id="newGame" class="secondary">Nuova partita</button>
</main>

<script>
const suits=[
 {name:"Denari",symbol:"🟡",red:false},
 {name:"Coppe",symbol:"🏆",red:true},
 {name:"Spade",symbol:"⚔️",red:false},
 {name:"Bastoni",symbol:"🪵",red:false}
];
let deck=[],hand=[],cpu=[],table=[],takenPlayer=[],takenCpu=[];
let selected=null,chosen=[],legalCombos=[],turn="player",busy=false;
let playerScore=0,cpuScore=0,playerScopes=0,cpuScopes=0,lastTaker=null;
const $=id=>document.getElementById(id);

function makeDeck(){
 const d=[];
 for(let s=0;s<4;s++)for(let v=1;v<=10;v++){
  d.push({id:s+"-"+v,value:v,suit:s,rank:v});
 }
 return d;
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function cardName(c){
 const ranks={1:"Asso",8:"Fante",9:"Cavallo",10:"Re"};
 return ranks[c.value]||String(c.value);
}
function cardNode(c,zone){
 const el=document.createElement("div");
 el.className="card"+(suits[c.suit].red?" red":"");
 if(zone==="hand"&&selected===c.id)el.classList.add("selected");
 if(zone==="table"&&legalCombos.some(combo=>combo.includes(c.id)))el.classList.add("take-option");
 if(zone==="table"&&chosen.includes(c.id))el.classList.add("take-chosen");
 el.innerHTML='<div class="rank">'+cardName(c)+'</div><div class="suit">'+suits[c.suit].symbol+'</div><div class="name">'+suits[c.suit].name+'</div>';
 if(zone==="hand")el.onclick=()=>selectHand(c.id);
 if(zone==="table")el.onclick=()=>selectTable(c.id);
 return el;
}
function render(){
 const ph=$("playerHand"),ch=$("cpuHand"),tb=$("table");
 ph.innerHTML="";ch.innerHTML="";tb.innerHTML="";
 hand.forEach(c=>ph.appendChild(cardNode(c,"hand")));
 cpu.forEach(()=>{const b=document.createElement("div");b.className="card back";b.textContent="🂠";ch.appendChild(b)});
 table.forEach(c=>tb.appendChild(cardNode(c,"table")));
 $("playerScore").textContent=playerScore;
 $("cpuScore").textContent=cpuScore;
 $("deckCount").textContent=deck.length;
 $("play").disabled=turn!=="player"||busy||selected===null;
}
function combinations(cards,target){
 const result=[];
 function walk(start,sum,ids){
  if(sum===target&&ids.length){result.push([...ids]);return}
  if(sum>=target)return;
  for(let i=start;i<cards.length;i++){
   walk(i+1,sum+cards[i].value,[...ids,cards[i].id]);
  }
 }
 walk(0,0,[]);
 return result;
}
function getCombos(card){
 const exact=table.filter(c=>c.value===card.value);
 if(exact.length)return exact.map(c=>[c.id]);
 return combinations(table,card.value);
}
function selectHand(id){
 if(turn!=="player"||busy)return;
 selected=id;chosen=[];
 const card=hand.find(c=>c.id===id);
 legalCombos=card?getCombos(card):[];
 if(legalCombos.length===1)chosen=[...legalCombos[0]];
 if(!legalCombos.length){
  $("message").textContent="Nessuna presa possibile: premi «Gioca carta» per lasciare la carta sul tavolo.";
 }else if(legalCombos.length===1){
  $("message").textContent="Presa evidenziata in oro. Premi «Gioca carta» per confermare.";
 }else{
  $("message").textContent="Tocca sul tavolo le carte della presa che vuoi fare, poi premi «Gioca carta».";
 }
 render();
}
function selectTable(id){
 if(turn!=="player"||busy||selected===null)return;
 if(!legalCombos.some(combo=>combo.includes(id)))return;
 if(chosen.includes(id)){
  chosen=chosen.filter(x=>x!==id);
 }else{
  chosen.push(id);
 }
 const valid=legalCombos.some(combo=>sameSet(combo,chosen));
 if(valid){
  $("message").textContent="Presa selezionata! Premi «Gioca carta» per confermare.";
 }else{
  $("message").textContent="Seleziona una combinazione valida di carte verdi.";
 }
 render();
}
function sameSet(a,b){
 return a.length===b.length&&a.every(x=>b.includes(x));
}
function say(t){$("message").textContent=t}
function celebrate(who){
 $("scopaBanner").style.display="block";
 $("scopaBanner").textContent="✨ SCOPA di "+who+"! ✨";
 setTimeout(()=>{$("scopaBanner").style.display="none"},1600);
}
function takeCard(card,who,ids){
 if(ids&&ids.length){
  const grabbed=table.filter(c=>ids.includes(c.id));
  if(grabbed.length){
   table=table.filter(c=>!ids.includes(c.id));
   if(who==="player")takenPlayer.push(card,...grabbed);
   else takenCpu.push(card,...grabbed);
   lastTaker=who;
   if(table.length===0&&deck.length+hand.length+cpu.length>0){
    if(who==="player"){playerScopes++;playerScore++;celebrate("TU");}
    else{cpuScopes++;cpuScore++;celebrate("COMPUTER");}
   }
   return true;
  }
 }
 table.push(card);
 return false;
}
function playPlayer(){
 if(turn!=="player"||busy||selected===null)return;
 const card=hand.find(c=>c.id===selected);
 if(!card)return;
 const combos=getCombos(card);
 let ids=[];
 if(combos.length){
  const valid=combos.some(combo=>sameSet(combo,chosen));
  if(!valid){
   say("Seleziona sul tavolo una presa valida prima di giocare.");
   return;
  }
  ids=[...chosen];
 }
 hand=hand.filter(c=>c.id!==card.id);
 selected=null;chosen=[];legalCombos=[];
 const captured=takeCard(card,"player",ids);
 if(captured)say("Hai preso le carte!");
 else say("Hai messo una carta sul tavolo.");
 turn="cpu";render();
 setTimeout(cpuMove,650);
}
function cpuMove(){
 if(!cpu.length){afterTurn();return}
 busy=true;
 const card=chooseCpuCard();
 const combos=getCombos(card);
 let ids=[];
 if(combos.length){
  combos.sort((a,b)=>b.length-a.length);
  ids=combos[0];
 }
 cpu=cpu.filter(c=>c.id!==card.id);
 const captured=takeCard(card,"cpu",ids);
 busy=false;
 if(captured)say("Il computer ha preso le carte.");
 else say("Il computer ha messo una carta sul tavolo.");
 turn="player";
 render();
 afterTurn();
}
function chooseCpuCard(){
 let best=cpu[0],bestScore=-999;
 for(const c of cpu){
  const combos=getCombos(c);
  let score=combos.length?10+combos[0].length:0;
  if(c.suit===0)score+=0.4;
  if(c.value===7&&c.suit===0)score+=3;
  score+=Math.random();
  if(score>bestScore){bestScore=score;best=c}
 }
 return best;
}
function afterTurn(){
 if(hand.length===0&&cpu.length===0){
  if(deck.length){
   deal();
  }else{
   if(table.length&&lastTaker){
    if(lastTaker==="player")takenPlayer.push(...table);
    else takenCpu.push(...table);
    table=[];
   }
   finishGame();
  }
 }
 render();
}
function deal(){
 for(let i=0;i<3&&deck.length;i++){
  if(deck.length)hand.push(deck.pop());
  if(deck.length)cpu.push(deck.pop());
 }
}
function finishGame(){
 // Punteggio finale: scope, maggior numero di carte, denari e settebello.
 let p=playerScore,c=cpuScore;
 if(takenPlayer.length>takenCpu.length)p++;
 else if(takenCpu.length>takenPlayer.length)c++;
 const pd=takenPlayer.filter(x=>x.suit===0).length;
 const cd=takenCpu.filter(x=>x.suit===0).length;
 if(pd>cd)p++;else if(cd>pd)c++;
 if(takenPlayer.some(x=>x.suit===0&&x.value===7))p++;
 if(takenCpu.some(x=>x.suit===0&&x.value===7))c++;
 playerScore=p;cpuScore=c;
 turn="over";render();
 say(p>c?"🏆 Hai vinto la partita!":"Partita terminata! "+(p===c?"Pareggio.":"Il computer ha vinto."));
 $("play").disabled=true;
}
function startGame(){
 deck=shuffle(makeDeck());
 hand=[];cpu=[];table=[];takenPlayer=[];takenCpu=[];
 selected=null;chosen=[];legalCombos=[];
 turn="player";busy=false;lastTaker=null;
 playerScore=0;cpuScore=0;playerScopes=0;cpuScopes=0;
 for(let i=0;i<4;i++)table.push(deck.pop());
 deal();
 $("scopaBanner").style.display="none";
 say("Tocca una tua carta. Le prese possibili si evidenziano in verde.");
 render();
}
$("play").addEventListener("click",playPlayer);
$("newGame").addEventListener("click",startGame);
startGame();
</script>
</body>
</html>
