
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scopa Napoletano</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#103d2b;color:#fff0c2;
font-family:Arial,sans-serif;text-align:center}
h1{color:#f4d17a}
#table,#hand{display:flex;flex-wrap:wrap;justify-content:center;
gap:9px;margin:18px auto;min-height:100px}
.card{width:65px;height:100px;background:#fff8e9;color:#222;
border:2px solid #d4ae55;border-radius:7px;font-size:22px;
font-weight:bold;display:flex;flex-direction:column;
justify-content:space-between;padding:7px;cursor:pointer}
.card small{font-size:12px}
button{padding:12px 18px;border:0;border-radius:8px;
background:#f1cb68;color:#193b2b;font-weight:bold;margin:8px}
#status{min-height:45px;line-height:1.5}
</style>
</head>
<body>
<h1>SCOPA NAPOLETANO</h1>
<p>Gioco di prova contro il computer</p>
<h3 id="score">Tu 0 — Computer 0</h3>
<h3>Tavolo</h3>
<div id="table"></div>
<h3>Le tue carte</h3>
<div id="hand"></div>
<p id="status">Premi Nuova partita per iniziare.</p>
<button onclick="newGame()">Nuova partita</button>
<script>
const semi=["♦ Denari","♥ Coppe","♠ Spade","♣ Bastoni"];
const nomi=["Asso","2","3","4","5","6","7","Fante","Cavallo","Re"];
let mazzo=[],mano=[],tavolo=[],computer=[],prese=[],punti=0;
let finita=true,ultimo=null;

function creaMazzo(){
 mazzo=[];
 semi.forEach((seme,s)=>{
  nomi.forEach((nome,i)=>mazzo.push({
   nome: nome,seme:seme,valore:i<7?i+1:i+1,
   id:s*10+i
  }));
 });
 for(let i=mazzo.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [mazzo[i],mazzo[j]]=[mazzo[j],mazzo[i]];
 }
}
function valore(c){return c.valore}
function mostra(c){
 return '<button class="card" onclick="gioca('+c.id+')">'+
 c.nome+'<small>'+c.seme+'</small></button>';
}
function render(){
 document.getElementById("table").innerHTML=tavolo.map(c=>
 '<div class="card">'+c.nome+'<small>'+c.seme+'</small></div>'
 ).join("");
 document.getElementById("hand").innerHTML=mano.map(c=>mostra(c)).join("");
 document.getElementById("score").textContent="Tu "+punti+
 " — Computer "+computer.length;
}
function newGame(){
 creaMazzo();mano=[];tavolo=[];computer=[];prese=[];punti=0;
 finita=false;ultimo=null;
 for(let i=0;i<4;i++)tavolo.push(mazzo.pop());
 distribuisci();
 document.getElementById("status").textContent="Tocca a te: scegli una carta.";
 render();
}
function distribuisci(){
 while(mano.length<3&&mazzo.length)mano.push(mazzo.pop());
 while(computer.length<3&&mazzo.length)computer.push(mazzo.pop());
}
function gioca(id){
 if(finita)return;
 let i=mano.findIndex(c=>c.id===id);
 if(i<0)return;
 let carta=mano.splice(i,1)[0];
 let presePossibili=tavolo.filter(c=>valore(c)===valore(carta));
 if(presePossibili.length){
  tavolo=tavolo.filter(c=>c!==presePossibili[0]);
  ultimo="tu";
  if(tavolo.length===0)punti++;
 }else tavolo.push(carta);
 if(mano.length===0&&mazzo.length){
  distribuisci();
 }
 if(mano.length===0&&!mazzo.length){
  finita=true;
  document.getElementById("status").textContent=
  "Mano terminata. Premi Nuova partita per ricominciare.";
 }else{
  document.getElementById("status").textContent="Turno del computer…";
  render();
  setTimeout(mossaComputer,600);
 }
 render();
}
function mossaComputer(){
 if(finita)return;
 if(!computer.length){
  distribuisci();
  if(!computer.length){finita=true;render();return;}
 }
 let carta=computer.pop();
 let i=tavolo.findIndex(c=>valore(c)===valore(carta));
 if(i>=0){
  tavolo.splice(i,1);ultimo="computer";
 }else tavolo.push(carta);
 if(!mano.length&&!computer.length&&!mazzo.length){
  finita=true;
  document.getElementById("status").textContent="Partita terminata.";
 }else{
  if(!mano.length&&mazzo.length)distribuisci();
  document.getElementById("status").textContent="Tocca a te.";
 }
 render();
}
</script>
</body>
</html>
