
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scopa Monopolygoita</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#073d2b;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:18px 8px;background:#092e24;border-bottom:2px solid #d6b45c}
h1{margin:0;color:#f5d778;font-size:25px}
header p{margin:6px 0 0;font-size:13px}
main{padding:12px;max-width:600px;margin:auto}
.panel{background:#126343;border:2px solid #d2b15d;border-radius:16px;padding:12px;margin:10px 0}
.label{font-size:14px;color:#ffe5a0;margin:5px}
.cards{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;min-height:94px}
.card{width:57px;height:88px;border-radius:7px;background:#fff8e8;color:#27211b;border:2px solid #d6c7a4;box-shadow:0 3px 5px #002b1d;display:flex;flex-direction:column;justify-content:space-between;padding:5px 3px;cursor:pointer;font-weight:bold;touch-action:manipulation}
.card .rank{font-size:17px;align-self:flex-start}
.card .suit{font-size:28px;align-self:center;line-height:1}
.card .bottom{font-size:13px;align-self:flex-end;transform:rotate(180deg)}
.card.red{color:#b32424}
.card.selected{outline:4px solid #ffe05d;transform:translateY(-5px)}
.card.back{background:repeating-linear-gradient(45deg,#9b2525,#9b2525 5px,#f8e6bd 5px,#f8e6bd 8px);color:transparent}
button{background:#f5d778;color:#172c20;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;font-size:15px;margin:5px;cursor:pointer}
button:disabled{opacity:.45}
#message{min-height:44px;font-size:15px;line-height:1.4;padding:8px}
.score{display:flex;justify-content:space-around;gap:8px;font-weight:bold}
.small{font-size:12px;color:#ffe8b0}
</style>
</head>
<body>
<header>
<h1>🃏 Scopa Monopolygoita</h1>
<p>Una sfida di carte contro il computer</p>
</header>
<main>
<div class="panel">
<div class="score">
<div>Tu: <span id="youScore">0</span></div>
<div>Computer: <span id="cpuScore">0</span></div>
</div>
<div class="small">Obiettivo: raggiungere 11 punti</div>
</div>

<div class="panel">
<div class="label">🤖 Carte del computer</div>
<div id="cpuCards" class="cards"></div>
</div>

<div class="panel">
<div class="label">🟢 Tavolo da gioco</div>
<div id="table" class="cards"></div>
<div class="small" id="deckInfo"></div>
</div>

<div class="panel">
<div class="label">🎴 Le tue carte — tocca una carta per giocarla</div>
<div id="hand" class="cards"></div>
<div id="message">Premi “Nuova partita” per iniziare.</div>
<button id="playBtn" disabled>Gioca carta selezionata</button>
<button id="newBtn">Nuova partita</button>
</div>
<div class="panel">
<div class="label">Ultima mano</div>
<div id="roundInfo">La partita non è ancora iniziata.</div>
</div>
</main>
<script>
const suits=[
 {name:"Denari",symbol:"●",red:true},
 {name:"Coppe",symbol:"♥",red:true},
 {name:"Spade",symbol:"⚔",red:false},
 {name:"Bastoni",symbol:"♣",red:false}
];
const names=["Asso","Due","Tre","Quattro","Cinque","Sei","Sette","Fante","Cavallo","Re"];
let deck=[],hand=[],cpuHand=[],table=[],capturedYou=[],capturedCpu=[];
let selected=null,turn="you",youScore=0,cpuScore=0,scopaYou=0,scopaCpu=0;
let lastTaker=null,started=false,finished=false;

function makeDeck(){
 let d=[];
 suits.forEach((s,si)=>{for(let n=1;n<=10;n++){
 d.push({id:si*10+n-1,n,suit:si,name:names[n-1],symbol:s.symbol,red:s.red});
 }});
 return d;
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
 let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];
 }return a;
}
function cardHTML(c,clickable=false,sel=false){
 return `<div class="card ${c.red?'red':''} ${sel?'selected':''}" ${clickable?`data-id="${c.id}"`:''}>
 <span class="rank">${c.name}</span><span class="suit">${c.symbol}</span>
 <span class="bottom">${c.n} · ${c.symbol}</span></div>`;
}
function render(){
 document.getElementById("youScore").textContent=youScore;
 document.getElementById("cpuScore").textContent=cpuScore;
 document.getElementById("hand").innerHTML=hand.map(c=>cardHTML(c,true,selected===c.id)).join("");
 document.getElementById("table").innerHTML=table.map(c=>cardHTML(c)).join("");
 document.getElementById("cpuCards").innerHTML=cpuHand.map(()=>'<div class="card back">■</div>').join("");
 document.getElementById("deckInfo").textContent=`Carte nel mazzo: ${deck.length}`;
 document.getElementById("playBtn").disabled=!started||finished||turn!=="you"||selected===null;
 document.querySelectorAll("#hand .card").forEach(el=>el.onclick=()=>{
 if(turn!=="you"||finished)return;
 selected=Number(el.dataset.id);render();
 });
}
function say(t){document.getElementById("message").textContent=t}
function start(){
 deck=shuffle(makeDeck());hand=[];cpuHand=[];table=[];
 capturedYou=[];capturedCpu=[];selected=null;turn="you";
 youScore=0;cpuScore=0;scopaYou=0;scopaCpu=0;lastTaker=null;
 started=true;finished=false;
 for(let i=0;i<4;i++)table.push(deck.pop());
 deal();say("Tocca una tua carta, poi gioca la carta selezionata.");
 document.getElementById("roundInfo").textContent="Buona partita!";
 render();
}
function deal(){
 while(hand.length<3&&deck.length)hand.push(deck.pop());
 while(cpuHand.length<3&&deck.length)cpuHand.push(deck.pop());
}
function combinations(cards,target){
 let out=[];
 for(let mask=1;mask<(1<<cards.length);mask++){
 let group=[],sum=0;
 cards.forEach((c,i)=>{if(mask&(1<<i)){group.push(c);sum+=c.n}});
 if(sum===target)out.push(group);
 }
 return out;
}
function chooseCapture(card,pile){
 // Se esiste una carta dello stesso valore, si prende quella.
 let equal=pile.find(c=>c.n===card.n);
 if(equal)return [equal];
 let combos=combinations(pile,card.n);
 return combos.length?combos[0]:[];
}
function play(){
 if(!started||finished||turn!=="you"||selected===null)return;
 const idx=hand.findIndex(c=>c.id===selected);
 if(idx<0)return;
 const card=hand[idx],takes=chooseCapture(card,table);
 hand.splice(idx,1);selected=null;
 if(takes.length){
 table=table.filter(c=>!takes.some(t=>t.id===c.id));
 capturedYou.push(card,...takes);lastTaker="you";
 if(table.length===0){scopaYou++;say("SCOPA! Hai raccolto tutte le carte!");}
 else say("Bella presa! Tocca al computer.");
 }else{
 table.push(card);say("Nessuna presa: la carta resta sul tavolo.");
 }
 render();
 if(hand.length===0&&cpuHand.length===0&&deck.length===0){endRound();return;}
 turn="cpu";render();setTimeout(cpuPlay,650);
}
function cpuPlay(){
 if(finished)return;
 if(cpuHand.length===0&&deck.length){deal();}
 if(cpuHand.length===0){turn="you";render();endRound();return;}
 let bestIndex=0,bestTakes=[];
 for(let i=0;i<cpuHand.length;i++){
 let t=chooseCapture(cpuHand[i],table);
 if(t.length){bestIndex=i;bestTakes=t;break;}
 }
 const card=cpuHand.splice(bestIndex,1)[0];
 if(bestTakes.length){
 table=table.filter(c=>!bestTakes.some(t=>t.id===c.id));
 capturedCpu.push(card,...bestTakes);lastTaker="cpu";
 if(table.length===0)scopaCpu++;
 }else table.push(card);
 if(hand.length===0&&cpuHand.length===0&&deck.length===0){render();endRound();return;}
 if(hand.length===0&&cpuHand.length===0&&deck.length>0)deal();
 turn="you";render();
 say(bestTakes.length?"Il computer ha preso delle carte. Tocca a te.":"Il computer ha giocato. Tocca a te.");
}
function primiera(cards){
 const values=cards.map(c=>({n:c.n,v:c.n===7?21:c.n===6?18:c.n===1?16:c.n===5?15:c.n===4?14:c.n===3?13:c.n===2?12:10}));
 let sum=0;
 for(let s=0;s<4;s++){
 let suitCards=cards.filter(c=>c.suit===s);
 if(suitCards.length)sum+=Math.max(...suitCards.map(c=>values.find(v=>v.n===c.n).v));
 }
 return sum;
}
function endRound(){
 if(finished)return;
 if(table.length){
 if(lastTaker==="cpu")capturedCpu.push(...table);
 else capturedYou.push(...table);
 table=[];
 }
 let p=0,q=0;
 if(capturedYou.length>capturedCpu.length)p++;
 else if(capturedCpu.length>capturedYou.length)q++;
 if(capturedYou.filter(c=>c.suit===0).length>capturedCpu.filter(c=>c.suit===0).length)p++;
 else if(capturedCpu.filter(c=>c.suit===0).length>capturedYou.filter(c=>c.suit===0).length)q++;
 if(capturedYou.some(c=>c.suit===0&&c.n===7))p++;
 if(capturedCpu.some(c=>c.suit===0&&c.n===7))q++;
 if(primiera(capturedYou)>primiera(capturedCpu))p++;
 else if(primiera(capturedCpu)>primiera(capturedYou))q++;
 p+=scopaYou;q+=scopaCpu;
 youScore+=p;cpuScore+=q;
 document.getElementById("roundInfo").textContent=
 `Tu: +${p} punti (${capturedYou.length} carte, ${scopaYou} scope). Computer: +${q} punti (${capturedCpu.length} carte, ${scopaCpu} scope).`;
 if(youScore>=11||cpuScore>=11){
 finished=true;
 say(youScore===cpuScore?"Pareggio! Premi Nuova partita.":youScore>cpuScore?"Hai vinto la partita! 🎉":"Il computer ha vinto. Riprova!");
 }else{
 say("Mano terminata. Premi Nuova partita per iniziare un'altra partita.");
 finished=true;
 }
 render();
}
document.getElementById("playBtn").onclick=play;
document.getElementById("newBtn").onclick=start;
render();
</script>
</body>
</html>
