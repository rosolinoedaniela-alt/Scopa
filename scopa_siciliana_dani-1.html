<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Scopa Siciliana di Dani</title><style>
:root{--green:#126744;--deep:#073e2c;--gold:#e8bd63;--cream:#fff3d7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#20855a 0,#0d573b 58%,#063522 100%);color:#fff7e5;font-family:Georgia,'Times New Roman',serif;min-height:100vh}.frame{max-width:850px;margin:auto;padding:12px;border:7px ridge #a87539;min-height:100vh;box-shadow:inset 0 0 0 3px #f0d28a}.header{text-align:center;padding:5px 0 10px}.header h1{margin:2px 0;color:#ffe3a0;text-shadow:0 2px 2px #3b1f0b;font-size:clamp(25px,6vw,42px)}.subtitle{letter-spacing:2px;font-size:12px;color:#f7d995}.scores{display:flex;justify-content:space-around;gap:8px;margin:8px 0 14px}.score{border:2px solid var(--gold);border-radius:14px;background:#5d2e19b8;padding:8px 16px;text-align:center;min-width:115px;box-shadow:0 3px 7px #002719}.score b{display:block;font-size:20px;color:#ffe3a0}.score small{font-size:12px}.table{border:2px solid #d9ad60;border-radius:20px;background:linear-gradient(135deg,#18744d,#0b4c34);padding:12px 8px;margin:0 auto;box-shadow:inset 0 0 18px #032d1b;min-height:190px}.zone-title{text-align:center;color:#f4d58e;font-size:13px;margin:2px 0 8px}.cards{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;min-height:95px}.card{width:clamp(57px,15vw,83px);height:clamp(90px,24vw,126px);border-radius:7px;border:2px solid #f2dfb4;background:#fff9e8;color:#25201a;box-shadow:0 3px 5px #002a1a;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 3px;overflow:hidden;cursor:pointer;touch-action:manipulation}.card:before{content:'';position:absolute;inset:4px;border:1px solid #b98d4e;border-radius:4px;pointer-events:none}.card .rank{font-weight:bold;font-size:16px;align-self:flex-start;margin-left:4px}.card .suit{font-size:25px;line-height:1}.card .figure{font-size:25px;line-height:1}.card .name{font-size:8px;letter-spacing:.2px;text-transform:uppercase}.card.red{color:#a52b27}.card.back{background:repeating-linear-gradient(45deg,#9b2924 0 5px,#f1d9a2 5px 7px);border-color:#ffe5ac}.card.back:after{content:'✦';position:absolute;inset:8px;border:2px double #f7e3b5;border-radius:4px;display:grid;place-items:center;color:#ffe9ba;font-size:28px;background:#a32e27aa}.card.selected{transform:translateY(-7px);outline:3px solid #ffe38a}.handwrap{margin-top:12px}.hand{min-height:115px}.status{text-align:center;min-height:26px;padding:9px 4px;color:#fff0c3;font-size:14px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}.btn{border:2px solid #f4d58e;background:linear-gradient(#a66c2c,#713b1d);color:#fff5d9;border-radius:22px;padding:10px 17px;font: bold 14px Georgia;box-shadow:0 3px 0 #44230f;cursor:pointer}.btn:disabled{opacity:.45}.foot{text-align:center;color:#e9d6a7;font-size:11px;margin-top:12px}.banner{display:none;text-align:center;font-size:25px;color:#ffe47a;text-shadow:0 0 12px #ffb52c;margin:4px}.banner.show{display:block;animation:pop .55s ease}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@media(min-width:600px){.table{padding:16px}.cards{gap:10px}}
</style></head><body><main class="frame"><header class="header"><div class="subtitle">✦ IL TAVOLO DI DANI ✦</div><h1>Scopa Siciliana</h1><div class="subtitle">TRADIZIONE • CARTE • DIVERTIMENTO</div></header><section class="scores"><div class="score"><small>Tu</small><b id="youScore">0</b><small>punti</small></div><div class="score"><small>Avversario</small><b id="cpuScore">0</b><small>punti</small></div></section><div class="table"><div class="zone-title">TAVOLO</div><div id="tableCards" class="cards"></div><div id="banner" class="banner">✦ SCOPA! ✦</div></div><div class="status" id="status">Tocca una carta della tua mano, poi scegli cosa prendere dal tavolo.</div><div class="handwrap"><div class="zone-title">LE TUE CARTE · <span id="remaining">40</span> nel mazzo</div><div id="hand" class="cards hand"></div></div><div class="actions"><button class="btn" id="newGame">Nuova partita</button><button class="btn" id="help">Regole rapide</button></div><div class="foot">Scopa Siciliana di Dani · partita di prova contro il computer</div></main><script>
const suits=[{name:'Denari',sym:'🟡',color:'gold'},{name:'Coppe',sym:'🏆',color:'red'},{name:'Spade',sym:'⚔️',color:'blue'},{name:'Bastoni',sym:'🪵',color:'green'}];const ranks=[{n:1,label:'Asso',fig:'A'},{n:2,label:'Due',fig:'2'},{n:3,label:'Tre',fig:'3'},{n:4,label:'Quattro',fig:'4'},{n:5,label:'Cinque',fig:'5'},{n:6,label:'Sei',fig:'6'},{n:7,label:'Sette',fig:'7'},{n:8,label:'Donna',fig:'D'},{n:9,label:'Cavallo',fig:'C'},{n:10,label:'Re',fig:'R'}];let deck=[],hand=[],cpuHand=[],table=[],picked=null,turn='you',scores={you:0,cpu:0},captured={you:[],cpu:[]},lastTaker='you',gameOver=false;const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newGame(){deck=shuffle(suits.flatMap((s,si)=>ranks.map(r=>({suit:si,suitName:s.name,sym:s.sym,color:s.color,n:r.n,label:r.label,fig:r.fig,id:si+'-'+r.n}))));hand=[];cpuHand=[];table=[];scores={you:0,cpu:0};captured={you:[],cpu:[]};lastTaker='you';picked=null;turn='you';gameOver=false;dealTable();dealHands();render();msg('Tocca una tua carta, poi scegli le carte del tavolo da prendere.');}function dealTable(){for(let i=0;i<4&&deck.length;i++)table.push(deck.pop())}function dealHands(){for(let i=0;i<3&&deck.length;i++){hand.push(deck.pop());cpuHand.push(deck.pop())}}function cardEl(c,click,selected=false){let el=document.createElement('button');el.className='card '+(c.color==='red'?'red':'')+(selected?' selected':'');el.innerHTML=`<span class="rank">${c.fig}</span><span class="suit">${c.sym}</span><span class="figure">${c.n>=8?({8:'♙',9:'♘',10:'♔'}[c.n]):c.fig}</span><span class="name">${c.label}</span>`;el.setAttribute('aria-label',c.label+' di '+c.suitName);el.onclick=click;return el}function render(){ $('youScore').textContent=scores.you;$('cpuScore').textContent=scores.cpu;$('remaining').textContent=deck.length;let tc=$('tableCards');tc.innerHTML='';table.forEach((c,i)=>tc.append(cardEl(c,()=>tableClick(i))));let hc=$('hand');hc.innerHTML='';hand.forEach((c,i)=>hc.append(cardEl(c,()=>handClick(i),picked===i)));}function msg(t){$('status').textContent=t}function handClick(i){if(gameOver||turn!=='you')return;picked=i;render();let sums=capturesFor(hand[i],table);if(sums.length===0){msg('Ora tocca una carta sul tavolo: non ci sono prese possibili.');}else if(sums.length===1){playHuman(i,sums[0]);}else{msg('Puoi prendere più combinazioni: tocca le carte del tavolo che vuoi catturare.');}}function tableClick(i){if(gameOver||turn!=='you')return;if(picked===null){msg('Prima scegli una carta della tua mano.');return}let c=hand[picked],possible=capturesFor(c,table);if(possible.length===0){playHuman(picked,[]);return}let chosen=[i];let sum=table[i].n;if(sum===c.n){playHuman(picked,[i]);return}if(possible.length===1){playHuman(picked,possible[0]);return}let indexes=possible.find(x=>x.length===1&&x[0]===i);if(indexes){playHuman(picked,indexes);return}msg('Per questa carta ci sono più prese possibili. Scegli una combinazione dalla mano: premi la carta per riprovare.');}function capturesFor(c,t){let exact=[];t.forEach((x,i)=>{if(x.n===c.n)exact.push([i])});if(exact.length)return exact;let out=[];function rec(start,sum,arr){for(let i=start;i<t.length;i++){let ns=sum+t[i].n,na=arr.concat(i);if(ns===c.n)out.push(na);else if(ns<c.n)rec(i+1,ns,na)}}rec(0,0,[]);return out}function playHuman(i,inds){if(i!==picked&&picked!==null)i=picked;let c=hand[i];if(!c)return;hand.splice(i,1);if(inds.length){let taken=inds.map(k=>table[k]).filter(Boolean);table=table.filter((_,k)=>!inds.includes(k));captured.you.push(c,...taken);lastTaker='you';if(table.length===0){scores.you++;$('banner').classList.add('show');setTimeout(()=>$('banner').classList.remove('show'),900);msg('SCOPA! Hai svuotato il tavolo: +1 punto.');}else msg('Bella presa!');}else{table.push(c);msg('Hai lasciato la carta sul tavolo.');}picked=null;render();turn='cpu';setTimeout(cpuPlay,650)}function cpuPlay(){if(gameOver)return;if(cpuHand.length===0&&hand.length===0){if(deck.length){dealHands();render();turn='you';msg('Nuova mano! Tocca una carta.');return}finishHand();return}if(cpuHand.length===0){turn='you';return}let best={i:0,inds:[]},bestVal=-1;cpuHand.forEach((c,i)=>{let caps=capturesFor(c,table);if(caps.length){let inds=caps[0],val=inds.length*3+inds.reduce((s,k)=>s+table[k].n,0)/10;if(val>bestVal){bestVal=val;best={i,inds}}}});let c=cpuHand.splice(best.i,1)[0];if(bestVal>=0){let taken=best.inds.map(k=>table[k]);table=table.filter((_,k)=>!best.inds.includes(k));captured.cpu.push(c,...taken);lastTaker='cpu';if(!table.length){scores.cpu++;msg('L’avversario ha fatto scopa!');}else msg('L’avversario ha preso delle carte.')}else{table.push(c);msg('L’avversario ha giocato una carta.')}render();if(cpuHand.length===0&&hand.length===0&&deck.length){dealHands();render();turn='you';msg('Nuova mano! Tocca una carta.');}else{turn='you';if(hand.length===0&&cpuHand.length===0&&deck.length===0)finishHand();}}function finishHand(){if(table.length){captured[lastTaker].push(...table);table=[]}let cy=captured.you,cc=captured.cpu;let points={you:0,cpu:0};if(cy.length>cc.length)points.you++;else if(cc.length>cy.length)points.cpu++;let coinsY=cy.filter(c=>c.suit===0).length,coinsC=cc.filter(c=>c.suit===0).length;if(coinsY>coinsC)points.you++;else if(coinsC>coinsY)points.cpu++;if(cy.some(c=>c.suit===0&&c.n===7))points.you++;if(cc.some(c=>c.suit===0&&c.n===7))points.cpu++;let primY=cy.reduce((s,c)=>s+(c.suit===0?1:0),0),primC=cc.reduce((s,c)=>s+(c.suit===0?1:0),0);scores.you+=points.you;scores.cpu+=points.cpu;render();if(scores.you>=11||scores.cpu>=11){gameOver=true;msg(scores.you===scores.cpu?'Pareggio! Premi Nuova partita.':scores.you>scores.cpu?'Hai vinto la partita! 🎉':'Ha vinto l’avversario. Riprova!');}else{msg(`Fine mano! Punti della mano: tu ${points.you}, avversario ${points.cpu}. Premi Nuova partita per ricominciare.`);gameOver=true}}$('newGame').onclick=newGame;$('help').onclick=()=>msg('Gioca una carta e prendi carte dello stesso valore oppure una combinazione che somma quel valore. Se lasci il tavolo vuoto fai SCOPA (+1). Partita di prova contro il computer.');newGame();
</script></body></html>
